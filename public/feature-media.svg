<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4FBF7"/>
      <stop offset="100%" stop-color="#E6F5EC"/>
    </linearGradient>
    <linearGradient id="btn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2FDB6F"/>
      <stop offset="100%" stop-color="#20B858"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="url(#bg)"/>

  <!-- Browser window mockup -->
  <rect x="180" y="120" width="1000" height="660" rx="24" fill="#FFFFFF" stroke="#E1E7E2" stroke-width="2"/>
  <rect x="180" y="120" width="1000" height="64" rx="24" fill="#F1F4F2"/>
  <rect x="180" y="160" width="1000" height="24" fill="#F1F4F2"/>
  <circle cx="222" cy="152" r="9" fill="#E4A951"/>
  <circle cx="254" cy="152" r="9" fill="#DE6B5C"/>
  <circle cx="286" cy="152" r="9" fill="#5FBF6E"/>

  <!-- Storefront placeholder content -->
  <rect x="230" y="230" width="300" height="220" rx="12" fill="#EAF6EF"/>
  <rect x="550" y="230" width="300" height="220" rx="12" fill="#EAF6EF"/>
  <rect x="870" y="230" width="260" height="220" rx="12" fill="#EAF6EF"/>

  <rect x="230" y="470" width="180" height="20" rx="6" fill="#DCE7E0"/>
  <rect x="550" y="470" width="180" height="20" rx="6" fill="#DCE7E0"/>
  <rect x="870" y="470" width="180" height="20" rx="6" fill="#DCE7E0"/>

  <rect x="230" y="504" width="120" height="16" rx="6" fill="#EDF3EF"/>
  <rect x="550" y="504" width="120" height="16" rx="6" fill="#EDF3EF"/>
  <rect x="870" y="504" width="120" height="16" rx="6" fill="#EDF3EF"/>

  <!-- Chat bubble tooltip -->
  <rect x="900" y="560" width="240" height="90" rx="20" fill="#FFFFFF" stroke="#DCE7E0" stroke-width="2"/>
  <text x="1020" y="596" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="24" font-weight="600" fill="#1F2A22" text-anchor="middle">Chat with us</text>
  <text x="1020" y="628" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="18" fill="#5B6B60" text-anchor="middle">We usually reply in minutes</text>
  <path d="M 1020 650 L 1000 680 L 1040 680 Z" fill="#FFFFFF" stroke="#DCE7E0" stroke-width="2"/>

  <!-- Floating button -->
  <circle cx="1080" cy="720" r="60" fill="url(#btn)"/>
  <path
    d="M 1080 686
       C 1050 686 1026 708 1026 736
       C 1026 748 1030 759 1038 768
       L 1032 792
       C 1031 796 1035 799 1039 797
       L 1062 787
       C 1067 788 1073 789 1080 789
       C 1110 789 1134 767 1134 739
       C 1134 711 1110 686 1080 686
       Z"
    fill="#FFFFFF"
  />
  <circle cx="1058" cy="738" r="7" fill="#20B858"/>
  <circle cx="1080" cy="738" r="7" fill="#20B858"/>
  <circle cx="1102" cy="738" r="7" fill="#20B858"/>

  <!-- Right-side headline -->
  <text x="1260" y="400" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="42" font-weight="700" fill="#1F2A22" text-anchor="middle">
    <tspan x="1260" dy="0">Chat with</tspan>
    <tspan x="1260" dy="54">shoppers on</tspan>
    <tspan x="1260" dy="54">WhatsApp</tspan>
  </text>
</svg>
